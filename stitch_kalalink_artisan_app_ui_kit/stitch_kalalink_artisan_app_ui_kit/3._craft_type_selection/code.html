<!-- Primary Action Button (Large high-contrast primary CTA button) -->
<button class="w-full h-14 bg-primary hover:bg-primary-container active:scale-[0.98] text-on-primary rounded-xl font-label-lg text-label-lg flex items-center justify-center gap-space-sm shadow-lg transition-all focus:outline-none cursor-pointer" id="btn-continue-craft" onclick="handleContinueToScreen4()" type="button">
<span>आगे बढ़ें / Continue</span>
<span class="material-symbols-outlined text-xl">arrow_forward</span>
</button>
</div>
</div>
<script>
  function handleNavigateBack() {
    // Navigation back to Screen 2 (Language & Role Selection)
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: 'NAVIGATE_TO_SCREEN', screen: 2 }, '*');
    }
    alert('स्क्रीन २ पर वापस जा रहे हैं (Navigating back to Screen 2: Language & Role Selection)');
  }

  function handleVoiceSelection() {
    const promptMsg = 'कृपया अपने शिल्प का नाम बोलें (उदा. "बुनकरी", "मिट्टी शिल्प") / Please speak your craft name...';
    const voiceInput = prompt(promptMsg, 'बुनकरी');
    if (voiceInput) {
      const inputLower = voiceInput.toLowerCase().trim();
      const allCards = document.querySelectorAll('.craft-card');
      let matched = false;
      allCards.forEach(card => {
        const craftKey = card.getAttribute('data-craft');
        const textContent = card.innerText.toLowerCase();
        if (textContent.includes(inputLower) || craftKey.includes(inputLower)) {
          card.classList.add('ring-2', 'ring-primary');
          matched = true;
        }
      });
      if (matched && window.updateSelectionState) {
        window.updateSelectionState();
      }
      alert(`आवाज पहचानी गई: "${voiceInput}"। आगे स्क्रीन ४ पर जा रहे हैं (Proceeding to Screen 4: Mobile Login & OTP)`);
      handleContinueToScreen4();
    }
  }

  function handleContinueToScreen4() {
    const selectedCards = document.querySelectorAll('.craft-card.ring-2');
    if (selectedCards.length === 0) {
      alert('कृपया आगे बढ़ने से पहले कम से कम एक शिल्प चुनें (Please select at least one craft before continuing)');
      return;
    }
    const selectedCrafts = Array.from(selectedCards).map(c => c.getAttribute('data-craft'));
    
    // Smooth visual feedback on button
    const btn = document.getElementById('btn-continue-craft');
    if (btn) {
      btn.style.opacity = '0.85';
      btn.style.transform = 'scale(0.98)';
      setTimeout(() => {
        btn.style.opacity = '1';
        btn.style.transform = 'scale(1)';
      }, 150);
    }

    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: 'NAVIGATE_TO_SCREEN', screen: 4, data: { crafts: selectedCrafts } }, '*');
    }
    alert(`शिल्प चयनित: [${selectedCrafts.join(', ')}] — स्क्रीन ४ पर आगे बढ़ रहे हैं (Navigating to Screen 4: Mobile Login & OTP)`);
  }

  function playAudioGuide() {
    const helper = document.getElementById('audio-helper');
    if (helper) {
      helper.classList.add('scale-95');
      setTimeout(() => helper.classList.remove('scale-95'), 200);
    }
    alert('ऑडियो निर्देश: कृपया उन सभी शिल्पों को चुनें जो आप बनाते हैं (Tap craft cards to select crafts)');
  }

  (function() {
    const cards = document.querySelectorAll('.craft-card');
    const countText = document.getElementById('craft-count-text');

    function updateSelectionState() {
      let activeCount = 0;
      cards.forEach(card => {
        const isSelected = card.classList.contains('ring-2');
        const badge = card.querySelector('.check-badge');
        const iconWrap = card.querySelector('.craft-icon-wrap');
        const titleText = card.querySelector('.craft-title');
        
        if (isSelected) {
          activeCount++;
          if (badge) {
            badge.classList.remove('hidden');
            badge.classList.add('flex');
          }
          card.classList.remove('bg-surface-container-low', 'shadow-sm');
          card.classList.add('bg-surface-container-lowest', 'shadow-md');
          if (iconWrap) {
            iconWrap.classList.remove('bg-surface-container-highest', 'text-on-surface-variant');
            iconWrap.classList.add('bg-primary-fixed', 'text-primary');
          }
          if (titleText) {
            titleText.classList.add('text-primary', 'font-semibold');
            titleText.classList.remove('text-on-surface');
          }
        } else {
          if (badge) {
            badge.classList.add('hidden');
            badge.classList.remove('flex');
          }
          card.classList.remove('bg-surface-container-lowest', 'shadow-md');
          card.classList.add('bg-surface-container-low', 'shadow-sm');
          if (iconWrap) {
            iconWrap.classList.remove('bg-primary-fixed', 'text-primary');
            iconWrap.classList.add('bg-surface-container-highest', 'text-on-surface-variant');
          }
          if (titleText) {
            titleText.classList.remove('text-primary', 'font-semibold');
            titleText.classList.add('text-on-surface');
          }
        }
      });

      const hindiNums = ['०', '१', '२', '३', '४', '५', '६', '७', '८', '९'];
      const hindiCount = hindiNums[activeCount] !== undefined ? hindiNums[activeCount] : activeCount;
      if (countText) {
        countText.textContent = `${hindiCount} शिल्प चुने गए • ${activeCount} Craft${activeCount === 1 ? '' : 's'} Selected`;
      }
    }

    window.updateSelectionState = updateSelectionState;

    cards.forEach(card => {
      card.addEventListener('click', (e) => {
        e.preventDefault();
        card.classList.toggle('ring-2');
        card.classList.toggle('ring-primary');
        updateSelectionState();
      });
    });

    // Run once on init to make sure state matches initial marks
    updateSelectionState();
  })();
</script></main>
</body></html>
