</head><body class="bg-surface font-body-md text-on-surface antialiased min-h-screen flex flex-col pt-safe pb-safe"><main class="flex flex-col relative w-full bg-surface min-h-screen"><div class="flex flex-col w-full relative">

</div>
<!-- Flash & Audio Action Pack -->
<div class="flex items-center gap-space-xs">
<!-- Flash Toggle -->
<button aria-label="Flash Toggle" class="w-12 h-12 rounded-full bg-inverse-surface/60 text-inverse-on-surface backdrop-blur-md flex items-center justify-center active:scale-90 transition-all shadow-md cursor-pointer" id="flashBtn" type="button">

</button>
<!-- Audio Instructions Trigger in Golden Ochre -->
<button aria-label="Audio Instructions / निर्देश सुनें" class="h-12 px-3 rounded-full bg-tertiary-container text-on-tertiary-container flex items-center gap-1.5 shadow-md active:scale-95 transition-transform cursor-pointer" id="audioCoachBtn" type="button">
<span class="material-symbols-outlined text-label-md animate-bounce" style="font-variation-settings: 'FILL' 1;">volume_up</span>
<span class="font-label-sm text-label-sm font-bold tracking-tight">सुनें</span>
</button>
</div>
</div>
<!-- Instruction Audio Banner Overlay (Pre-literate friendly) -->
<div class="flex items-center gap-2.5 px-3.5 py-2 rounded-xl bg-surface-container-lowest/95 text-on-surface shadow-md backdrop-blur-sm transition-all duration-300" id="audioToast">
<div class="w-7 h-7 rounded-full bg-tertiary-fixed text-on-tertiary-fixed flex items-center justify-center flex-shrink-0">
<span class="material-symbols-outlined text-body-sm" style="font-variation-settings: 'FILL' 1;">record_voice_over</span>
</div>
<div class="flex flex-col min-w-0">
<p class="font-label-sm text-label-sm text-on-surface font-semibold truncate leading-tight" id="audioToastHi">
            उत्पाद को फ्रेम के अंदर रखें और अच्छी रोशनी दें
          </p>
<p class="font-body-sm text-[11px] text-on-surface-variant truncate leading-tight" id="audioToastEn">
            Keep product centered inside frame with clear lighting
          </p>
</div>
</div>
</div>
<!-- Center Viewfinder Grid with Handloom/Pottery Alignment Guides -->
<div class="relative z-10 flex-1 flex items-center justify-center px-6 py-2">
<!-- Framing Box -->
<div class="relative w-full max-w-[290px] aspect-[4/5] flex items-center justify-center">
<!-- Subtle Ambient Frame Dotted Outline (Simulating Craft Canvas Grid) -->
<div class="absolute inset-0 rounded-2xl border-2 border-dashed border-surface-container-lowest/40 pointer-events-none"></div>
<!-- Corner Guide Brackets (Dignity-first Terracotta Accent) -->
<!-- Top Left -->
<div class="absolute -top-1 -left-1 w-7 h-7 border-t-4 border-l-4 border-primary rounded-tl-lg shadow-sm"></div>
<!-- Top Right -->
<div class="absolute -top-1 -right-1 w-7 h-7 border-t-4 border-r-4 border-primary rounded-tr-lg shadow-sm"></div>
<!-- Bottom Left -->
<div class="absolute -bottom-1 -left-1 w-7 h-7 border-b-4 border-l-4 border-primary rounded-bl-lg shadow-sm"></div>
<!-- Bottom Right -->
<div class="absolute -bottom-1 -right-1 w-7 h-7 border-b-4 border-r-4 border-primary rounded-br-lg shadow-sm"></div>
<!-- Central Leveling Crosshair Reticle -->
<div class="relative flex items-center justify-center w-12 h-12 pointer-events-none opacity-60">
<div class="w-3 h-0.5 bg-surface-container-lowest rounded-full"></div>
<div class="h-3 w-0.5 bg-surface-container-lowest rounded-full absolute"></div>
<div class="w-1.5 h-1.5 rounded-full bg-primary-fixed ring-2 ring-primary absolute"></div>
</div>
<!-- Smart Silhouette Craft Suggestion (Subtle watermark guides pottery outline) -->
<svg class="w-44 h-44 text-surface-container-lowest/25 absolute pointer-events-none" fill="none" stroke="currentColor" stroke-dasharray="2 3" stroke-width="1.2" viewbox="0 0 100 100">
<ellipse cx="50" cy="22" rx="16" ry="6"></ellipse>
<path d="M34 22 C34 32, 22 42, 20 62 C18 78, 30 84, 50 84 C70 84, 82 78, 80 62 C78 42, 66 32, 66 22"></path>
<line x1="28" x2="72" y1="84" y2="84"></line>
</svg>
<!-- Trust Watermark Stamp on lower viewfinder edge -->
<div class="absolute bottom-2 inset-x-0 flex justify-center pointer-events-none">
<div class="flex items-center gap-1 px-2.5 py-1 rounded-full bg-inverse-surface/75 text-inverse-on-surface backdrop-blur-sm shadow-sm">
<span class="material-symbols-outlined text-label-sm text-tertiary-fixed-dim" style="font-variation-settings: 'FILL' 1;">verified</span>
<span class="font-label-sm text-[10px] tracking-wider uppercase font-bold text-surface-container-lowest">Terra Loom AI Vision Assist</span>
</div>
</div>
</div>
</div>
<!-- Bottom Controls Deck -->
<div class="relative z-20 flex flex-col gap-space-md px-margin pb-margin">
<!-- Mode Selector Pills (Scrollable vernacular modes) -->
<div class="flex items-center justify-center gap-2 overflow-x-auto py-1 no-scrollbar" id="modePillsContainer">
<!-- Single Photo (Selected) -->
<button class="mode-chip px-3.5 py-1.5 rounded-full bg-primary text-on-primary font-label-sm text-label-sm shadow-md flex items-center gap-1.5 transition-all cursor-pointer active:scale-95" data-mode="single" type="button">
<span class="material-symbols-outlined text-label-sm">photo_camera</span>
<span class="">एक फोटो / Single</span>
</button>
<!-- 360 Spin View -->
<button class="mode-chip px-3.5 py-1.5 rounded-full bg-inverse-surface/60 text-surface-container-high backdrop-blur-md font-label-sm text-label-sm flex items-center gap-1.5 hover:bg-inverse-surface/80 transition-all cursor-pointer active:scale-95" data-mode="360" type="button">
<span class="material-symbols-outlined text-label-sm">360</span>
<span class="">360° घुमावदार</span>
</button>
<!-- Close-up Texture -->
<button class="mode-chip px-3.5 py-1.5 rounded-full bg-inverse-surface/60 text-surface-container-high backdrop-blur-md font-label-sm text-label-sm flex items-center gap-1.5 hover:bg-inverse-surface/80 transition-all cursor-pointer active:scale-95" data-mode="texture" type="button">
<span class="material-symbols-outlined text-label-sm">zoom_in</span>
<span class="">नक्काशी / Texture</span>
</button>
</div>
<!-- Shutter & Peripheral Actions Row -->
<div class="flex items-center justify-around w-full max-w-sm mx-auto pt-1 pb-2">
<!-- Gallery Upload Action -->
<div class="flex flex-col items-center gap-1">
<button aria-label="Choose from Gallery / गैलरी से चुनें" class="w-14 h-14 rounded-2xl bg-surface-container-lowest/80 text-on-surface backdrop-blur-md flex items-center justify-center shadow-md active:scale-90 transition-all cursor-pointer" onclick="alert('गैलरी से फोटो चुनें (Opening photo gallery...)')" type="button">
<span class="material-symbols-outlined text-headline-md text-secondary" style="font-variation-settings: 'FILL' 1;">photo_library</span>
</button>
<span class="font-label-sm text-[10px] text-surface-container-lowest font-medium text-center drop-shadow">गैलरी</span>
</div>
<!-- Center Shutter Button (Dual-Ring Terracotta & Cream Tactile Stamp) -->
<div class="flex flex-col items-center">
<button aria-label="Capture Photo / फोटो खींचें" class="group relative w-20 h-20 rounded-full bg-primary p-1.5 shadow-xl active:scale-90 transition-all duration-150 flex items-center justify-center cursor-pointer ring-4 ring-primary/30" id="shutterBtn" onclick="alert('फोटो खींची गई! AI स्टूडियो प्रोसेसिंग शुरू हो रही है (Photo Captured! Opening AI Processing...)')" type="button">
<!-- Outer Tactile Ring -->
<div class="absolute inset-0 rounded-full border-4 border-surface-container-lowest/90 pointer-events-none"></div>
<!-- Inner Ring Stamp Surface -->
<div class="w-full h-full rounded-full bg-surface-container-lowest group-active:bg-primary-fixed flex items-center justify-center transition-colors shadow-inner pointer-events-none">
<div class="w-10 h-10 rounded-full bg-primary group-active:scale-90 transition-transform"></div>
</div>
</button>
</div>
<!-- Flip Camera Action -->
<div class="flex flex-col items-center gap-1">
<button aria-label="Flip Camera / कैमरा बदलें" class="w-14 h-14 rounded-2xl bg-surface-container-lowest/80 text-on-surface backdrop-blur-md flex items-center justify-center shadow-md active:scale-90 transition-all cursor-pointer" id="flipBtn" onclick="alert('कैमरा बदला गया (Camera switched)')" type="button">
<span class="material-symbols-outlined text-headline-md text-secondary" id="flipIcon">flip_camera_ios</span>
</button>
<span class="font-label-sm text-[10px] text-surface-container-lowest font-medium text-center drop-shadow">बदलें</span>
</div>
</div>
</div>
</div>
<!-- Capture Feedback Flash Effect Layer -->
<div class="absolute inset-0 bg-surface-container-lowest pointer-events-none opacity-0 transition-opacity duration-150 rounded-3xl z-50" id="captureFlash"></div>
</div>
<script>
  (function() {
    const shutter = document.getElementById('shutterBtn');
    const flash = document.getElementById('captureFlash');
    const flashBtn = document.getElementById('flashBtn');
    const flashIcon = document.getElementById('flashIcon');
    const flipBtn = document.getElementById('flipBtn');
    const cameraFeed = document.getElementById('cameraFeed');
    const audioCoachBtn = document.getElementById('audioCoachBtn');
    const audioToast = document.getElementById('audioToast');
    const modeChips = document.querySelectorAll('.mode-chip');

    // Shutter Click Micro-interaction
    if (shutter && flash) {
      shutter.addEventListener('click', () => {
        flash.classList.remove('opacity-0');
        flash.classList.add('opacity-90');
        setTimeout(() => {
          flash.classList.remove('opacity-90');
          flash.classList.add('opacity-0');
        }, 120);
      });
    }

    // Dynamic Mode Chips Switching
    const activeClasses = ['bg-primary', 'text-on-primary', 'shadow-md'];
    const inactiveClasses = ['bg-inverse-surface/60', 'text-surface-container-high', 'backdrop-blur-md', 'hover:bg-inverse-surface/80'];

    modeChips.forEach((chip) => {
      chip.addEventListener('click', () => {
        modeChips.forEach((btn) => {
          btn.classList.remove(...activeClasses);
          btn.classList.add(...inactiveClasses);
        });
        chip.classList.remove(...inactiveClasses);
        chip.classList.add(...activeClasses);
      });
    });

    // Flash Mode Cycle: Auto -> On -> Off
    const flashStates = [
      { icon: 'flash_auto', label: 'Auto' },
      { icon: 'flash_on', label: 'On' },
      { icon: 'flash_off', label: 'Off' }
    ];
    let currentFlashIdx = 0;

    if (flashBtn && flashIcon) {
      flashBtn.addEventListener('click', () => {
        currentFlashIdx = (currentFlashIdx + 1) % flashStates.length;
        flashIcon.textContent = flashStates[currentFlashIdx].icon;
      });
    }

    // Flip Camera Transform
    let isFlipped = false;
    if (flipBtn && cameraFeed) {
      flipBtn.addEventListener('click', () => {
        isFlipped = !isFlipped;
        cameraFeed.style.transform = isFlipped ? 'scaleX(-1)' : 'scaleX(1)';
      });
    }

    // Audio Assist Coaching Toggle with Speech/Feedback trigger
    if (audioCoachBtn && audioToast) {
      audioCoachBtn.addEventListener('click', () => {
        audioToast.classList.add('ring-2', 'ring-tertiary-container', 'scale-105');
        setTimeout(() => {
          audioToast.classList.remove('ring-2', 'ring-tertiary-container', 'scale-105');
        }, 800);

        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance('उत्पाद को फ्रेम के अंदर रखें और अच्छी रोशनी दें। Terra Loom AI Vision assist active.');
          utterance.lang = 'hi-IN';
          utterance.rate = 0.95;
          window.speechSynthesis.speak(utterance);
        } else {
          alert('ऑडियो निर्देश: उत्पाद को फ्रेम के अंदर रखें और अच्छी रोशनी दें (Keep product centered inside frame with clear lighting)');
        }
      });
    }
  })();
</script></main>
</body></html>
